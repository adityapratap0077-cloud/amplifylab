name: ship

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Static asset check
        run: |
          for f in index.html styles.css app.js vercel.json README.md LICENSE .gitignore; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f" >&2
              exit 1
            fi
          done
          echo "All required static files present."
      - name: README freshness check
        run: |
          if ! grep -q "Live Demo" README.md; then
            echo "README is missing the Live Demo section. Regenerate with readme-gen.py." >&2
            exit 1
          fi
